<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 &mdash; Fiovivor Archive</title>
  <meta property="og:title" content="404 — Fiovivor Archive">
  <meta property="og:description" content="This channel got voted out. Page not found.">
  <meta property="og:image" content="https://fiovivor.org/embedlogo.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#5865f2">
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 0%, #16213e 0%, #1a1a2e 60%);
    }

    .logo {
      max-width: 200px;
      height: auto;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }

    .code {
      font-size: 6rem;
      font-weight: 700;
      letter-spacing: 4px;
      line-height: 1;
      color: #5865f2;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 1rem;
    }

    h1 .hash {
      color: #5865f2;
      font-weight: 700;
      margin-right: 0.15rem;
    }

    p {
      color: #888;
      font-size: 0.95rem;
      margin-top: 0.75rem;
      max-width: 440px;
      line-height: 1.6;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      padding: 0.65rem 1.4rem;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    .home-btn:hover {
      background: #4752c4;
    }

    .home-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    @media (max-width: 600px) {
      .logo { max-width: 130px; }
      .code { font-size: 4rem; }
      h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <img class="logo" src="/logo.png" alt="Fiovivor Logo">
  <div class="code">404</div>
  <h1><span class="hash">#</span>channel-not-found</h1>
  <p>Looks like this one got voted out. The page you&rsquo;re looking for doesn&rsquo;t exist &mdash; it may have been moved, renamed, or blindsided.</p>
  <a class="home-btn" href="/">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Back to the Archive
  </a>

</body>
</html>
