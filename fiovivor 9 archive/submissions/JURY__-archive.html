<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#__𝐉𝐔𝐑𝐘__ — Fiovivor S9 | Hollywoo: BvW</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #36393f;
    color: #dcddde;
    font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.375;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

header {
    padding: 24px 16px;
    border-bottom: 1px solid #42454a;
    background: #2f3136;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
}

header .hash {
    color: #72767d;
    margin-right: 2px;
}

header .meta {
    color: #72767d;
    font-size: 13px;
    margin-top: 4px;
}

header .topic {
    color: #96989d;
    font-size: 13px;
    margin-top: 4px;
}

.messages {
    padding: 16px 0;
}

.msg-group {
    padding: 4px 16px 4px 72px;
    position: relative;
    margin-top: 12px;
}

.msg-group:hover {
    background: #32353b;
}

.msg-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    position: absolute;
    left: 16px;
    top: 4px;
    object-fit: cover;
}

.author {
    font-weight: 600;
    font-size: 15px;
    cursor: default;
}

.username {
    color: #72767d;
    font-size: 12px;
}

.bot-tag {
    background: #5865f2;
    color: #fff;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
    vertical-align: middle;
    margin-left: 4px;
}

.timestamp {
    color: #72767d;
    font-size: 12px;
    margin-left: auto;
}

.msg {
    padding: 2px 0;
}

.content {
    word-wrap: break-word;
    white-space: pre-wrap;
}

.content code {
    background: #2f3136;
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 13px;
    font-family: 'Consolas', 'Courier New', monospace;
}

.content pre {
    background: #2f3136;
    padding: 8px;
    border-radius: 4px;
    margin: 4px 0;
    overflow-x: auto;
}

.content pre code {
    padding: 0;
    background: none;
}

.content strong { color: #fff; }

.reply {
    font-size: 13px;
    color: #72767d;
    padding: 2px 0 4px 0;
    border-left: 2px solid #4f545c;
    padding-left: 8px;
    margin-bottom: 4px;
}

.reply-author {
    font-weight: 600;
    color: #b9bbbe;
}

.attachment img {
    max-width: 400px;
    max-height: 300px;
    border-radius: 4px;
    margin: 4px 0;
}

.attachment a {
    color: #00aff4;
    text-decoration: none;
}

.attachment a:hover { text-decoration: underline; }

.embed {
    border-left: 4px solid #4f545c;
    background: #2f3136;
    padding: 8px 12px;
    border-radius: 4px;
    margin: 4px 0;
    max-width: 520px;
}

.embed-title {
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
}

.embed-title a { color: #00aff4; text-decoration: none; }
.embed-title a:hover { text-decoration: underline; }

.embed-desc {
    font-size: 14px;
    color: #dcddde;
}

.embed-img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 4px;
    margin-top: 8px;
}

.reactions {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    flex-wrap: wrap;
}

.reaction {
    background: #2f3136;
    border: 1px solid #4f545c;
    border-radius: 8px;
    padding: 2px 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
}

.reaction-count {
    font-size: 12px;
    color: #b9bbbe;
}

@media (max-width: 600px) {
    .msg-group { padding-left: 56px; }
    .avatar { width: 32px; height: 32px; }
    .attachment img { max-width: 100%; }
}

</style>
</head>
<body>
<div class="container">
<header>
    <h1><span class="hash">#</span>__𝐉𝐔𝐑𝐘__</h1>
    <p class="meta">Fiovivor S9 | Hollywoo: BvW &middot; 0 messages archived</p>
    
</header>
<div class="messages">

</div>
</div>
</body>
</html>
